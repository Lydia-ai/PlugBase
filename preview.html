<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plugbase — Campus Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: rgb(233, 161, 233);
    --bg-card: #ffffff;
    --bg-header: #ffffff;
    --accent: #f97316;
    --accent-soft: #fed7aa;
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --border-soft: #e5e7eb;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
  }

  header {
    background: var(--bg-header);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    font-weight: 800;
    font-size: 22px;
    color: var(--accent);
  }

  .search-box input {
    background: #fff;
    border: 1px solid var(--border-soft);
    padding: 10px 14px;
    border-radius: 10px;
    width: 320px;
    color: var(--text-main);
  }

  .header-actions button {
    background: var(--accent);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  .container {
    max-width: 1200px;
    margin: 32px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 32px;
  }

  .filters {
    background: var(--bg-card);
    padding: 20px;
    border-radius: 14px;
    border: 1px solid var(--border-soft);
  }

  .filters h3 {
    margin-top: 0;
    font-size: 16px;
    margin-bottom: 16px;
  }

  .filters label {
    font-size: 13px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 6px;
  }

  .filters input {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    margin-bottom: 14px;
  }

  .listings {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--bg-card);
    border-radius: 18px;
    border: 1px solid var(--border-soft);
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.08);
  }

  .card-img {
    background: linear-gradient(135deg, var(--accent-soft), #fff7ed);
    height: 140px;
  }

  .card-body {
    padding: 16px;
  }

  .card-title {
    font-weight: 600;
    margin: 0 0 6px;
  }

  .price {
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .seller {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .card-actions {
    display: flex;
    gap: 10px;
  }

  .card-actions button {
    flex: 1;
    background: #fff;
    border: 1px solid var(--border-soft);
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
  }

  .card-actions button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>

</head>
<body>

  <header>
    <div class="logo">Plugbase</div>

    <div class="search-box">
      <input type="text" placeholder="Search items..." />
    </div>

    <div class="header-actions">
      <button>Post listing</button>
    </div>
  </header>

  <main class="container">
    <!-- Filters -->
    <aside class="filters">
      <h3>Filters</h3>

      <label>Min price</label>
      <input type="number" placeholder="₦0" />

      <label>Max price</label>
      <input type="number" placeholder="₦50,000" />
    </aside>

    <!-- Listings -->
    <section class="listings">
      <div class="card">
        <div class="card-img"></div>
        <div class="card-body">
          <p class="card-title">Laptop Charger</p>
          <p class="price">₦5,000</p>
          <p class="seller">Lydia • CST</p>
          <div class="card-actions">
            <button>View</button>
            <button>Contact</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-img"></div>
        <div class="card-body">
          <p class="card-title">Bluetooth Mouse</p>
          <p class="price">₦3,500</p>
          <p class="seller">Daniel • EEE</p>
          <div class="card-actions">
            <button>View</button>
            <button>Contact</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-img"></div>
        <div class="card-body">
          <p class="card-title">USB Flash Drive (32GB)</p>
          <p class="price">₦2,000</p>
          <p class="seller">Amaka • MIS</p>
          <div class="card-actions">
            <button>View</button>
            <button>Contact</button>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
